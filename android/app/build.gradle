apply plugin: 'com.android.application'

def releaseSigningValues = [
    keystorePath: System.getenv('FERRYTRANSIT_ANDROID_KEYSTORE_PATH'),
    storePassword: System.getenv('FERRYTRANSIT_ANDROID_KEYSTORE_PASSWORD'),
    keyAlias: System.getenv('FERRYTRANSIT_ANDROID_KEY_ALIAS'),
    keyPassword: System.getenv('FERRYTRANSIT_ANDROID_KEY_PASSWORD')
]
def configuredReleaseSigningValues = releaseSigningValues.findAll { key, value -> value?.trim() }
def hasCompleteReleaseSigning = configuredReleaseSigningValues.size() == releaseSigningValues.size()
def requestedReleaseArtifact = gradle.startParameter.taskNames.any { taskName ->
    def normalizedTaskName = taskName.toLowerCase()
    (normalizedTaskName.contains('bundle') || normalizedTaskName.contains('assemble')) &&
        normalizedTaskName.contains('release')
}

android {
    namespace "com.naturebotlab.ferrytransit"
    compileSdk rootProject.ext.compileSdkVersion
    signingConfigs {
        if (hasCompleteReleaseSigning) {
            release {
                storeFile file(releaseSigningValues.keystorePath)
                storePassword releaseSigningValues.storePassword
                keyAlias releaseSigningValues.keyAlias
                keyPassword releaseSigningValues.keyPassword
            }
        }
    }
    defaultConfig {
        applicationId "com.naturebotlab.ferrytransit"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 25002
        versionName "2.5"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
            if (hasCompleteReleaseSigning) {
                signingConfig signingConfigs.release
            }
        }
    }
}

if (!configuredReleaseSigningValues.isEmpty() && !hasCompleteReleaseSigning) {
    def missingNames = releaseSigningValues.findAll { key, value -> !value?.trim() }.keySet().join(', ')
    throw new GradleException("Android release signing configuration is incomplete. Missing: ${missingNames}")
}

if (requestedReleaseArtifact && !hasCompleteReleaseSigning) {
    throw new GradleException(
        'Android release signing is required. Set FERRYTRANSIT_ANDROID_KEYSTORE_PATH, ' +
        'FERRYTRANSIT_ANDROID_KEYSTORE_PASSWORD, FERRYTRANSIT_ANDROID_KEY_ALIAS, and ' +
        'FERRYTRANSIT_ANDROID_KEY_PASSWORD.'
    )
}

if (hasCompleteReleaseSigning && !file(releaseSigningValues.keystorePath).isFile()) {
    throw new GradleException(
        "Android release keystore was not found: ${releaseSigningValues.keystorePath}"
    )
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
