name: Update JAL timetable

on:
  schedule:
    - cron: '17 18 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-jal-timetable-dev
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout dev
        uses: actions/checkout@v4
        with:
          ref: dev

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Fetch and validate JAL timetable
        run: xvfb-run -a npm run timetable:refresh:jal

      - name: Publish timetable to dev Storage
        env:
          FIREBASE_SERVICE_ACCOUNT_DEV: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_DEV }}
          FIREBASE_STORAGE_BUCKET: oki-ferryguide-dev.firebasestorage.app
        run: |
          test -n "$FIREBASE_SERVICE_ACCOUNT_DEV"
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT_DEV" > "$RUNNER_TEMP/firebase-service-account.json"
          GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/firebase-service-account.json" npm run timetable:publish

      - name: Commit generated timetable data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add gtfs/raw/air/jal_oki_timetable.json
          git add gtfs/generated/bus/oki_airport_bus_timetable.json
          git add gtfs/generated/public/timetable.json
          if ! git diff --cached --quiet; then
            git commit -m "chore(timetable): update JAL Oki schedule"
            git push origin HEAD:dev
          fi
