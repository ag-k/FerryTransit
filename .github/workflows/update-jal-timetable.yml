name: Update JAL timetable

on:
  schedule:
    - cron: '17 18 * * *'
  workflow_dispatch:
    inputs:
      publish_existing:
        description: Publish and smoke-test the existing committed artifact even when unchanged
        required: false
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: update-jal-timetable-dev
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout dev
        uses: actions/checkout@v4
        with:
          ref: dev

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Acquire JAL timetable
        run: xvfb-run -a npm run transport:acquire -- --source jal-oki-flights

      - name: Validate JAL source
        run: npm run transport:check -- --source jal-oki-flights

      - name: Build public timetable once
        run: npm run transport:build -- --source jal-oki-flights

      - name: Detect timetable changes
        id: timetable-changes
        run: |
          git add gtfs/raw/air/jal_oki_timetable.json
          git add gtfs/generated/bus/oki_airport_bus_timetable.json
          git add gtfs/generated/public/timetable.json
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit generated timetable data
        if: steps.timetable-changes.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore(timetable): update JAL Oki schedule"
          git push origin HEAD:dev

      - name: Publish committed timetable to dev Storage
        if: steps.timetable-changes.outputs.changed == 'true' || inputs.publish_existing == true
        env:
          FIREBASE_SERVICE_ACCOUNT_DEV: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_DEV }}
        run: |
          test -n "$FIREBASE_SERVICE_ACCOUNT_DEV"
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT_DEV" > "$RUNNER_TEMP/firebase-service-account.json"
          trap 'rm -f "$RUNNER_TEMP/firebase-service-account.json"' EXIT
          SOURCE_GIT_SHA="$(git rev-parse HEAD)" \
            SOURCE_GIT_DATE="$(git show -s --format=%cI HEAD)" \
            GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/firebase-service-account.json" \
            npm run transport:publish -- --source jal-oki-flights --target dev

      - name: Smoke test committed timetable on dev Storage
        if: steps.timetable-changes.outputs.changed == 'true' || inputs.publish_existing == true
        run: npm run transport:smoke -- --source jal-oki-flights --target dev --git-sha "$(git rev-parse HEAD)"

      - name: Skip unchanged timetable
        if: steps.timetable-changes.outputs.changed == 'false' && inputs.publish_existing != true
        run: echo "JAL timetable is unchanged; commit, backup, and publish were skipped."
