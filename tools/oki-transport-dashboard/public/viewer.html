<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>資料ビューア - 隠岐交通ソース監視</title>
    <link rel="stylesheet" href="/styles.css">
  </head>
  <body class="viewer-body">
    <div class="viewer-shell">
      <header class="viewer-topbar">
        <button id="backBtn" class="button primary" type="button">
          <span class="icon" aria-hidden="true">←</span>
          一覧へ戻る
        </button>
        <div class="viewer-title">
          <p id="viewerSource">資料</p>
          <h1 id="viewerTitle">読み込み中</h1>
          <a id="viewerUrl" href="#" target="_blank" rel="noreferrer">直接開く</a>
        </div>
      </header>
      <main id="viewerContent" class="viewer-content" aria-label="資料表示"></main>
    </div>
    <script src="/viewer.js" type="module"></script>
  </body>
</html>
